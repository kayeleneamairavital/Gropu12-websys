<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Aside</title>
<html>
        <style>
            main{
                padding: 10px;
                margin:10px;
            }
            aside{
                width:200px;
                border:1px solid black;
                padding:10px;
                margin:10px;
                float:left;
            }
        </style>
    <head>
    <body>
        <aside>
            <h2>Sidebar</h2>
            <p>This is some content in the sidebar.</p>
        </aside>
        <main>
            <h1>Main Content</h1>
            <p>This is the main content of the page</p>
        </main>
    </body>
    </html>
